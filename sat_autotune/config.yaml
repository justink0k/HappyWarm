name: SAT Autotune
version: "0.2.2"
slug: sat_autotune
description: Meet de prestaties van de cv-ketel en stelt SAT begrensd bij om gas te besparen
url: https://github.com/justink0k/HappyWarm
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - homeassistant_config:ro
ingress: true
ingress_port: 8099
panel_icon: mdi:fire-circle
panel_title: SAT Autotune
options:
  run_mode: normal
  log_level: info
  expected_sat_version: "4.2.0"
  degree_day_base: 18.0
  base_gas_m3_per_day: 0.0
  report_weekday: mon
  report_time: "07:00"
  dry_run_weeks: 4
  wait_days: 14
  min_valid_days: 7
  min_degree_days_per_day: 5.0
  max_away_fraction: 0.25
  max_person_away_fraction: 0.75
  min_improvement_pct: 2.0
  max_starts_increase_pct: 20.0
  quiet_start: "22:00"
  quiet_end: "07:00"
  comfort_monitor_rooms:
    - woonkamer
    - kantoor
  comfort_limit_c: 1.0
  comfort_max_hours: 2.0
  coef_min: 1.0
  coef_max: 3.0
  coef_step: 0.1
  max_setpoint_min: 50
  max_setpoint_max: 65
  max_setpoint_step: 5
  cycles_min: 3
  cycles_max: 4
  opv_min: 42
  opv_max: 52
  opv_step: 1
  field_coef: heating_curve_coefficient
  field_max_setpoint: maximum_setpoint
  field_cycles: cycles_per_hour
  field_opv: ""
  field_selftest: target_temperature_step
  entity_dhw: ""
  anthropic_api_key: ""
  anthropic_model: claude-sonnet-5-5
schema:
  run_mode: list(normal|test_7d|selftest_options)
  log_level: list(debug|info|warning|error)
  expected_sat_version: str
  degree_day_base: float
  base_gas_m3_per_day: float
  report_weekday: list(mon|tue|wed|thu|fri|sat|sun)
  report_time: str
  dry_run_weeks: int
  wait_days: int
  min_valid_days: int
  min_degree_days_per_day: float
  max_away_fraction: float
  max_person_away_fraction: float
  min_improvement_pct: float
  max_starts_increase_pct: float
  quiet_start: str
  quiet_end: str
  comfort_monitor_rooms:
    - str
  comfort_limit_c: float
  comfort_max_hours: float
  coef_min: float
  coef_max: float
  coef_step: float
  max_setpoint_min: int
  max_setpoint_max: int
  max_setpoint_step: int
  cycles_min: int
  cycles_max: int
  opv_min: int
  opv_max: int
  opv_step: int
  field_coef: str
  field_max_setpoint: str
  field_cycles: str
  field_opv: str?
  field_selftest: str
  entity_dhw: str?
  anthropic_api_key: password?
  anthropic_model: str
